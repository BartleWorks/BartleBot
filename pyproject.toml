[tool.poetry]
name = "bartlebot"
version = "0.1.0"
description = "Wizard101 behavior tree bot"
authors = []
packages = [{include = "bartlebot"}]

[tool.poetry.dependencies]
python = "^3.13"
PyQt6 = "^6.7"
qasync = "^0.27"
pyperclip = "^1.8"
transitions = {extras = ["asyncio"], version = "^0.9"}
pydantic = "^2.0"
keyring = "^25.0"
wakepy = "^1.0"
curl_cffi = "^0.15"
beautifulsoup4 = "^4.0"
# Forks, not upstream: these carry fixes upstream does not have, including the
# memory offsets bartlebot/deck_io.py depends on. Pinned by exact commit --
# see "Changing wizwalker or wizsprinter" in CLAUDE.md for the bump workflow.
# HTTPS URLs so CI can fetch them without SSH credentials.
wizwalker = {git = "https://github.com/The-World-Tree/wizwalker.git", rev = "1d1db0fefb5c6e33436ac3d96ee544913e43a66b"}
WizSprinter = {git = "https://github.com/The-World-Tree/wizsprinter.git", rev = "2118aa77ef530db202d51338988e0fed8c022003"}

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.0"
ruff = "^0.15"
pytest-xdist = "^3.6"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernize syntax)
    "B",   # flake8-bugbear (common bugs)
]
ignore = [
    "E501",  # line too long — handled by formatter, not linter
    "E402",  # module-level import not at top — intentional logger-before-imports pattern
    "B905",  # zip() without strict= — intentional; lists always same length in gather patterns
    "B008",  # function call in default — intentional Qt lambda captures
]

[tool.ruff.lint.per-file-ignores]
"bartlebot/nodes/node_helpers.py" = ["F401"]  # intentional re-exports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
