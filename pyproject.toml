[tool.poetry]
name = "bartlebot"
version = "0.1.0"
description = "Wizard101 behavior tree bot"
authors = []
packages = [{include = "bartlebot"}]

[tool.poetry.dependencies]
python = "^3.13"
PyQt6 = "^6.7"
qasync = "^0.27"
pyperclip = "^1.8"
transitions = {extras = ["asyncio"], version = "^0.9"}
pydantic = "^2.0"
keyring = "^25.0"
wakepy = "^1.0"
wizwalker = {git = "https://github.com/Deimos-Wizard101/wizwalker", branch = "development"}
WizSprinter = {git = "https://github.com/Deimos-Wizard101/wizsprinter.git", rev = "222fc7a85d2a4b1578cc895bbf97af446c6dbce9"}

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.0"
ruff = "^0.15"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernize syntax)
    "B",   # flake8-bugbear (common bugs)
]
ignore = [
    "E501",  # line too long — handled by formatter, not linter
    "E402",  # module-level import not at top — intentional logger-before-imports pattern
    "B905",  # zip() without strict= — intentional; lists always same length in gather patterns
    "B008",  # function call in default — intentional Qt lambda captures
]

[tool.ruff.lint.per-file-ignores]
"bartlebot/nodes/node_helpers.py" = ["F401"]  # intentional re-exports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
