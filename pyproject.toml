[project]
name = "bartlebot"
version = "0.1.0"
description = "Wizard101 behavior tree bot"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "PyQt6>=6.7",
    "qasync>=0.27",
    "pyperclip>=1.8",
    "transitions>=0.9",
    "pydantic>=2.0",
    "keyring>=25.0",
    "wakepy>=1.0",
    "curl_cffi>=0.15",
    "beautifulsoup4>=4.0",
    "wizwalker",
    "wizsprinter",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.15",
    "pytest-xdist>=3.6",
    "pre-commit>=4.0",
    # Supplies the session-scoped `qapp` fixture the GUI tests share.
    "pytest-qt>=4.5.0",
    "katsuba>=0.4.0",
    "pytest-cov>=6.0",
    # Decodes the game's DXT3/DXT5 textures for tools/extract_card_art.py. Dev-only:
    # nothing at runtime reads a WAD, and the extracted art is PNG by the time the app
    # sees it -- Qt's build here has no dds plugin, which is why the tool converts.
    "pillow>=11.0",
]

# Ours, not upstream: these carry fixes the original projects do not have,
# including the memory offsets bartlebot/deck_io.py depends on. Pinned by exact
# commit -- see docs/UPSTREAM.md for the bump workflow and the pin tagging rule.
# HTTPS URLs so CI can fetch them without SSH credentials.
[tool.uv.sources]
wizwalker = { git = "https://github.com/The-World-Tree/wizwalker.git", rev = "26affbaadb7b3f75fe7342c1f7176a99ca45d572" }
wizsprinter = { git = "https://github.com/The-World-Tree/wizsprinter.git", rev = "4d6183efd226e7dbd5b181a3a7df886feeaebec8" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Stated rather than sniffed, so pytest-qt cannot pick a different binding than the app.
qt_api = "pyqt6"

[tool.coverage.run]
source = ["bartlebot"]
branch = true

[tool.coverage.report]
skip_empty = true

[tool.ruff]
# ruff 0.16 formats fenced code blocks inside Markdown. Our .md files use
# hand-aligned comment columns in their examples, which that collapses; the
# docs are prose, not compiled code, so they stay out of the formatter.
extend-exclude = ["*.md"]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernize syntax)
    "B",   # flake8-bugbear (common bugs)
]
ignore = [
    "E501",  # line too long — handled by formatter, not linter
    "E402",  # module-level import not at top — intentional logger-before-imports pattern
    "B905",  # zip() without strict= — intentional; lists always same length in gather patterns
    "B008",  # function call in default — intentional Qt lambda captures
]

[tool.ruff.lint.per-file-ignores]
"bartlebot/nodes/node_helpers.py" = ["F401"]  # intentional re-exports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bartlebot"]
