[project]
name = "bartlebot"
version = "0.2.0"
description = "Wizard101 behavior tree bot"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    # The family's shared library: accounts, the client runtime and the widgets both apps
    # use (bartleby-core/docs/ARCHITECTURE.md). Pinned by commit below.
    "bartleby-core[runtime,qt]",
    "PyQt6>=6.9",
    "qasync>=0.27",
    "pyperclip>=1.8",
    "transitions>=0.9",
    "pydantic>=2.0",
    "keyring>=25.0",
    "wakepy>=1.0",
    "curl_cffi>=0.15",
    "beautifulsoup4>=4.0",
    "wizwalker",
    "wizsprinter",
    "vdf>=3.4",
    # Game art extraction (bartlebot/game/art_extraction.py), from setup and Settings:
    # katsuba reads the game's WADs and spell templates, and Pillow decodes their
    # DXT3/DXT5 textures to PNG, since Qt's build here has no dds plugin. Nothing else
    # reads a WAD at run time.
    "katsuba>=0.4.0",
    "pillow>=11.0",
    # Installs and updates a packaged build (docs/INSTALLER.md). Pinned, never floating:
    # vpk in release.yml is the same version, and a test holds the two together.
    "velopack==1.2.161",
    # Verifies the update feed's Ed25519 signature (bartlebot/updates/feed.py), and signs
    # it in release.yml (tools/sign_feed.py).
    "cryptography>=44",
    "pywebview>=6.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.15",
    "pytest-xdist>=3.6",
    "pre-commit>=4.0",
    # Supplies the session-scoped `qapp` fixture the GUI tests share.
    "pytest-qt>=4.5.0",
    "pytest-cov>=6.0",
]
package = [
    "pyinstaller>=6.22.3",
]
# The download site (site/, .github/workflows/site.yml). Pinned exactly: Zensical is still
# 0.0.x, and its builds and its warnings change between releases.
site = [
    "zensical==0.0.71",
]

# Ours, not upstream: these carry fixes the original projects do not have,
# including the memory offsets bartlebot/combat/deck_io.py depends on. Pinned by exact
# commit -- see bartleby-core/docs/UPSTREAM.md for the bump workflow and the pin tagging rule.
# HTTPS URLs so CI can fetch them without SSH credentials.
[tool.uv.sources]
bartleby-core = { git = "https://github.com/BartleWorks/bartleby-core.git", rev = "6c63c2b63a6854c913c52402ebac562702004ad3" }
wizwalker = { git = "https://github.com/BartleWorks/wizwalker.git", rev = "e73a73635bedfc0e05f2730f277c43b49c24f113" }
wizsprinter = { git = "https://github.com/BartleWorks/wizsprinter.git", rev = "088fc838bda285c8b06d2f235fb5671126035f59" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Stated rather than sniffed, so pytest-qt cannot pick a different binding than the app.
qt_api = "pyqt6"
# A passing test's tmp_path is removed in its own teardown, spread across the xdist
# workers. Kept by default, a full run's ~16k entries were deleted three runs later,
# single-threaded in the controller after the last test: ~8 s on every run. A failing
# test's directory is still kept for inspection.
tmp_path_retention_policy = "failed"

[tool.coverage.run]
source = ["bartlebot"]
branch = true

[tool.coverage.report]
skip_empty = true

[tool.ruff]
# ruff 0.16 formats fenced code blocks inside Markdown. Our .md files use
# hand-aligned comment columns in their examples, which that collapses; the
# docs are prose, not compiled code, so they stay out of the formatter.
extend-exclude = ["*.md"]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernize syntax)
    "B",   # flake8-bugbear (common bugs)
]
ignore = [
    "E501",  # line too long — handled by formatter, not linter
    "E402",  # module-level import not at top — intentional logger-before-imports pattern
    "B905",  # zip() without strict= — intentional; lists always same length in gather patterns
    "B008",  # function call in default — intentional Qt lambda captures
]

[tool.ruff.lint.per-file-ignores]
"bartlebot/nodes/node_helpers.py" = ["F401"]  # intentional re-exports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bartlebot"]
