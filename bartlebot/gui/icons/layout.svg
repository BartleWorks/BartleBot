<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Left column: single node (root) -->
  <rect x="1" y="9" width="6" height="6" rx="1.5" stroke="#404040" stroke-width="2" fill="none"/>
  <!-- Right column: two nodes -->
  <rect x="13" y="3" width="6" height="5" rx="1.5" stroke="#404040" stroke-width="2" fill="none"/>
  <rect x="13" y="16" width="6" height="5" rx="1.5" stroke="#404040" stroke-width="2" fill="none"/>
  <!-- Orthogonal edges from root to each right node -->
  <polyline points="7,12 10,12 10,5.5 13,5.5" stroke="#404040" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="7,12 10,12 10,18.5 13,18.5" stroke="#404040" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
