<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none">
  <!-- outer border representing the full scene -->
  <rect x="1.5" y="1.5" width="17" height="17" rx="2" stroke="white" stroke-width="1.3"/>
  <!-- small node shapes -->
  <rect x="3.5" y="4" width="4" height="2.5" rx="0.6" fill="white" opacity="0.55"/>
  <rect x="10" y="4" width="4" height="2.5" rx="0.6" fill="white" opacity="0.55"/>
  <rect x="3.5" y="9" width="4" height="2.5" rx="0.6" fill="white" opacity="0.55"/>
  <!-- viewport indicator (dashed rect) -->
  <rect x="8" y="8" width="10" height="10" rx="1.2" fill="rgba(120,170,255,0.18)" stroke="white" stroke-width="1.3" stroke-dasharray="2.5 1.5"/>
</svg>
