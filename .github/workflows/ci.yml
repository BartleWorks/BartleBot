name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --locked fails the run if pyproject.toml was edited without relocking,
      # rather than silently resolving something the lockfile does not describe.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Test
        # -n auto, not a fixed count: GitHub runners have far fewer cores than a
        # dev machine, and oversubscribing them stretches the suite's few
        # wall-clock-sensitive tests until they fail.
        # Coverage is reported, not gated: the number is for reading, and no
        # threshold fails the run. Source and report settings are in pyproject.toml.
        run: uv run pytest -n auto --cov
