name: Package

# Started by hand: builds a packaged BartleBot with each packager, proves each build
# carries everything the app reads (--self-check), scans it with Defender, and uploads it.
# docs/RELEASING.md has why, and what each step answers.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        packager: [pyinstaller, nuitka]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --group package

      # Builds, then runs the build's own --self-check, which fails this step on any
      # missing file, module or plugin. Writes dist/<packager>/build-report.json.
      - name: Build and self-check
        run: uv run --group package python packaging/build.py ${{ matrix.packager }}

      - name: Defender scan
        if: always()
        shell: pwsh
        run: |
          $folder = (Get-ChildItem dist/${{ matrix.packager }} -Directory | Select-Object -First 1).FullName
          Update-MpSignature -ErrorAction SilentlyContinue
          $status = Get-MpComputerStatus
          $scan = & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File $folder -DisableRemediation | Out-String
          $threats = Get-MpThreatDetection | Where-Object { $_.Resources -match [regex]::Escape($folder) }
          @(
            "## ${{ matrix.packager }}: Defender",
            "Engine $($status.AMProductVersion), signatures $($status.AntivirusSignatureVersion)",
            '```', $scan.Trim(), '```',
            "Detections in the build: $(@($threats).Count)"
          ) -join "`n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $scan.Trim() | Out-File -Encoding utf8 dist/${{ matrix.packager }}/defender.txt

      - name: Report
        if: always()
        run: |
          if [ -f dist/${{ matrix.packager }}/build-report.json ]; then
            {
              echo "## ${{ matrix.packager }}: build"
              echo '```json'
              cat dist/${{ matrix.packager }}/build-report.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bartlebot-${{ matrix.packager }}
          path: dist/${{ matrix.packager }}
          if-no-files-found: warn
          retention-days: 14
