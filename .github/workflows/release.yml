name: Release

# On a v* tag: checks the tag names the app's version, builds and self-checks the app,
# packs it with Velopack against the previous release, signs the feed, and creates a
# DRAFT GitHub Release with every asset and the feed's signature. A maintainer publishes
# the draft, once what ships has been tested in game. docs/RELEASING.md has why, the
# version rule, and the signing key.
#
# Three jobs, so the signing key reaches only the one that needs it: `build` runs every
# dependency's code and never sees it, `sign` reads only the feed, and `publish` uploads.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time: each one's delta is made against the release before it.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Pinned, never floating. tools/pack_release.py's VELOPACK_VERSION and the velopack
  # package in pyproject.toml are the same version, and a test holds all three together.
  VELOPACK_VERSION: "1.2.161"
  # The cryptography the signing job installs on its own: uv.lock's, which a test holds it to.
  CRYPTOGRAPHY_VERSION: "50.0.1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --locked also fails a version bumped in pyproject.toml without relocking.
      - name: Install dependencies
        run: uv sync --locked --group package

      # Fails the run before anything is built when the tag is not "v" + the version
      # in pyproject.toml, or that version is not SemVer 2.
      - name: Check the tag names the version
        id: version
        run: |
          version=$(uv run --no-sync python tools/release_version.py "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Builds dist/BartleBot, dist/bartlebot.ico and dist/bartlebot-splash.png, then runs the build's own
      # --self-check, which fails this step on any missing file, module or plugin.
      - name: Build and self-check
        run: uv run --no-sync --group package python tools/build_package.py

      - name: Install vpk
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet tool install vpk --version "$VELOPACK_VERSION" --tool-path "$RUNNER_TEMP/vpk"

      # The latest published release's full package and feed, so the pack can make a
      # delta against it. With no published release yet, vpk says so and exits 0.
      - name: Fetch the previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          "$RUNNER_TEMP/vpk/vpk" download github
          --repoUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --token "$GH_TOKEN" --outputDir releases

      - name: Pack
        run: >
          uv run --no-sync python tools/pack_release.py "${{ steps.version.outputs.version }}"
          --vpk "$RUNNER_TEMP/vpk/vpk" --out releases

      - name: Keep the packages for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: releases
          path: releases/
          if-no-files-found: error

      # The feed alone, for the signing job, which never needs the packages.
      - name: Keep the feed for the signing job
        uses: actions/upload-artifact@v4
        with:
          name: feed
          path: releases/releases.win.json
          if-no-files-found: error

      - name: Report
        if: always()
        run: |
          {
            echo "## Release ${GITHUB_REF_NAME}"
            if [ -d releases ]; then
              echo '```'
              ls -l releases
              echo '```'
            fi
            if [ -f dist/build-report.json ]; then
              echo '```json'
              cat dist/build-report.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The one job that reads FEED_SIGNING_KEY, a secret of the `release` environment, which
  # only v* tags may deploy to (docs/RELEASING.md, "The signing key").
  sign:
    needs: build
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Fetch the feed
        uses: actions/download-artifact@v4
        with:
          name: feed
          path: feed

      # Then checks the signature against TRUSTED_KEYS, the keys the app itself trusts,
      # so a secret that does not match them fails here rather than shipping a feed no
      # installed copy would accept.
      - name: Sign the feed
        env:
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
        run: |
          uv run --no-project --with "cryptography==$CRYPTOGRAPHY_VERSION" python tools/sign_feed.py sign feed/releases.win.json
          uv run --no-project --with "cryptography==$CRYPTOGRAPHY_VERSION" python tools/sign_feed.py verify feed/releases.win.json

      - name: Keep the signature for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: feed-signature
          path: feed/releases.win.json.sig
          if-no-files-found: error

  publish:
    needs: [build, sign]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Fetch the packages
        uses: actions/download-artifact@v4
        with:
          name: releases
          path: releases

      - name: Fetch the signature
        uses: actions/download-artifact@v4
        with:
          name: feed-signature
          path: releases

      # The feed about to be uploaded is the one that was signed: any difference fails
      # the release before it exists.
      - name: Check the signature against the feed being published
        run: uv run --no-project --with "cryptography==$CRYPTOGRAPHY_VERSION" python tools/sign_feed.py verify releases/releases.win.json

      - name: Install vpk
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet tool install vpk --version "$VELOPACK_VERSION" --tool-path "$RUNNER_TEMP/vpk"

      # Without --publish, vpk leaves the release as a draft: publishing it is the
      # maintainer's step, and the one that makes users see it.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          "$RUNNER_TEMP/vpk/vpk" upload github
          --repoUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --token "$GH_TOKEN" --outputDir releases
          --tag "$GITHUB_REF_NAME" --releaseName "BartleBot ${{ needs.build.outputs.version }}"

      # vpk uploads only what it packed, so the signature is added to the draft after it.
      - name: Attach the feed's signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" releases/releases.win.json.sig --repo "$GITHUB_REPOSITORY"
